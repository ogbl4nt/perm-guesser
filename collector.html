<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сборщик точек для «Угадай Пермь»</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b12;color:#eef3f7;font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:20px}
.card{width:min(640px,100%);padding:28px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18)}
h1{margin:0 0 6px;font-size:26px}p{color:rgba(238,243,247,.65);margin:0 0 16px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 22px;cursor:pointer;background:linear-gradient(180deg,#ffc467,#ff9f2e);color:#1b1304;margin-right:8px}
button:disabled{opacity:.45;cursor:wait}
#log{margin-top:18px;max-height:280px;overflow:auto;font:13px/1.5 ui-monospace,Consolas,monospace;color:#9fd6dd;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
  <h1>Сборщик точек</h1>
  <p>Скачивает из OpenStreetMap границу города Перми и дороги внутри неё, равномерно выбирает точки по всем районам и отдаёт файл <b>points.json</b>. Запускается один раз, занимает 2–5 минут. Ключ Яндекса не используется.</p>
  <button id="go">Собрать точки</button><button id="dl" style="display:none">Скачать points.json</button>
  <div id="log"></div>
</div>
<script>
const SERVERS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
const NAME = '["name"~"^(Пермь|городской округ Пермь|Пермский городской округ)$"]';
const REL = `["boundary"="administrative"]["admin_level"~"^(6|8)$"]${NAME}`;
const HW = 'residential|service|living_street|unclassified|tertiary|secondary|primary|trunk|pedestrian';
const TILES = 4, STEP_M = 300, CAP_PER_CELL = 3, CELL = [0.01, 0.02];   // ячейка ≈ 1.1 × 1.2 км
const $ = id => document.getElementById(id);
const log = t => { $('log').textContent += t + '\n'; $('log').scrollTop = 1e9; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function q(body){
  let err;
  for (let round = 0; round < 2; round++){
    for (const s of SERVERS){
      try {
        const r = await fetch(s, {method:'POST', body:'data=' + encodeURIComponent(body)});
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.json();
      } catch(e){ err = e; log('  сервер ' + new URL(s).host + ': ' + e.message); }
    }
    await sleep(4000);
  }
  throw err;
}

function dist(a, b){
  const dy = (b.lat - a.lat) * 111320, dx = (b.lon - a.lon) * 111320 * Math.cos(a.lat * Math.PI / 180);
  return Math.hypot(dx, dy);
}

async function run(){
  $('go').disabled = true; $('dl').style.display = 'none'; $('log').textContent = '';
  log('1/3 Ищу границу города…');
  const bb = await q(`[out:json][timeout:60];rel${REL};out bb;`);
  const bs = bb.elements.map(e => e.bounds).filter(Boolean);
  if (!bs.length) throw new Error('Граница Перми не найдена в OSM');
  const B = {s:Math.min(...bs.map(b => b.minlat)), n:Math.max(...bs.map(b => b.maxlat)), w:Math.min(...bs.map(b => b.minlon)), e:Math.max(...bs.map(b => b.maxlon))};
  log(`  найдено границ: ${bs.length}, рамка ${B.s.toFixed(3)}–${B.n.toFixed(3)} с.ш., ${B.w.toFixed(3)}–${B.e.toFixed(3)} в.д.`);

  log('2/3 Загружаю дороги по квадратам…');
  const ways = new Map();
  for (let i = 0; i < TILES; i++) for (let j = 0; j < TILES; j++){
    const s = B.s + (B.n - B.s) * i / TILES, n = B.s + (B.n - B.s) * (i + 1) / TILES;
    const w = B.w + (B.e - B.w) * j / TILES, e = B.w + (B.e - B.w) * (j + 1) / TILES;
    const body = `[out:json][timeout:180];rel${REL};map_to_area->.a;way["highway"~"^(${HW})$"](area.a)(${s},${w},${n},${e});out geom;`;
    const data = await q(body);
    data.elements.forEach(el => { if (el.geometry && el.geometry.length) ways.set(el.id, el.geometry); });
    log(`  квадрат ${i * TILES + j + 1}/${TILES * TILES}: всего дорог ${ways.size}`);
    await sleep(1500);
  }

  log('3/3 Выбираю точки равномерно по городу…');
  const cells = new Map();
  for (const g of ways.values()){
    let acc = 0;
    for (let k = 0; k < g.length; k++){
      if (k > 0) acc += dist(g[k - 1], g[k]);
      if (k === 0 || acc >= STEP_M){
        acc = 0;
        const key = Math.floor(g[k].lat / CELL[0]) + '_' + Math.floor(g[k].lon / CELL[1]);
        if (!cells.has(key)) cells.set(key, []);
        cells.get(key).push([+g[k].lat.toFixed(5), +g[k].lon.toFixed(5)]);
      }
    }
  }
  const out = [];
  for (const arr of cells.values()){
    for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    out.push(...arr.slice(0, CAP_PER_CELL));
  }
  log(`Готово: ${out.length} точек в ${cells.size} ячейках.`);
  const url = URL.createObjectURL(new Blob([JSON.stringify(out)], {type:'application/json'}));
  $('dl').onclick = () => { const a = document.createElement('a'); a.href = url; a.download = 'points.json'; a.click(); };
  $('dl').style.display = '';
}
$('go').onclick = () => run().catch(e => log('Ошибка: ' + e.message)).finally(() => $('go').disabled = false);
</script>
</body>
</html>
